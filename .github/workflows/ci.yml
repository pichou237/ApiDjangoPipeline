name: CI Sécurité Python

on:
  push:
    branches: [ main, dev ,feature/dev]
  pull_request:
    branches: [ main, dev ,feature/dev]

jobs:
  security_analysis:
    runs-on: ubuntu-latest
    name: Analyse de sécurité Python

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libxslt-dev \
            python3-dev \
            build-essential \
            jq  # Pour le traitement JSON

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install bandit safety pip-audit

      - name: Analyse de code avec Bandit
        id: bandit-scan
        run: |
          CONFIG_FILE=""
          [ -f bandit.yaml ] && CONFIG_FILE="-c bandit.yaml"
          
          bandit -r . $CONFIG_FILE -f json -o bandit-report.json
          
          # Analyse des résultats
          HIGH_VULNS=$(jq '.results[] | select(.issue_severity == "HIGH") | .issue_text' bandit-report.json | wc -l)
          echo "high_vulns=$HIGH_VULNS" >> $GITHUB_OUTPUT
          
          cat bandit-report.json | jq .
        continue-on-error: true

      - name: Analyse des dépendances avec Safety
        id: safety-scan
        run: |
          if [ -f requirements.txt ]; then
            # Version JSON pour l'intégration
            safety check -r requirements.txt --output json > safety-report.json
            
            # Version lisible dans les logs
            echo "=== RAPPORT SAFETY ==="
            safety check -r requirements.txt --full-report || true
            
            # Comptage des vulnérabilités
            VULNS=$(jq '.vulnerabilities | length' safety-report.json)
            echo "vulns=$VULNS" >> $GITHUB_OUTPUT
          else
            echo "Fichier requirements.txt non trouvé"
          fi
        continue-on-error: true

      - name: Analyse avec pip-audit (complémentaire)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f json -o pip-audit-report.json
            [ -s pip-audit-report.json ] && jq . pip-audit-report.json || echo "Aucune vulnérabilité détectée"
          fi
        continue-on-error: true

      - name: Vérifier les dépendances obsolètes
        run: |
          pip list --outdated --format=columns

      - name: Téléverser les rapports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            *-report.json
            requirements.txt

      - name: Évaluer les résultats
        if: |
          steps.bandit-scan.outputs.high_vulns > 0 ||
          steps.safety-scan.outputs.vulns > 0
        run: |
          echo "::error::Vulnérabilités critiques détectées :"
          echo "- Bandit : ${{ steps.bandit-scan.outputs.high_vulns }} vulnérabilités HIGH"
          echo "- Safety : ${{ steps.safety-scan.outputs.vulns }} vulnérabilités"
          exit 1