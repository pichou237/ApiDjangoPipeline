name: CI Sécurité

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev python3-dev build-essential jq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les outils
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          [ -f requirements.txt ] && pip install -r requirements.txt

      - name: Analyse Bandit
        run: |
          bandit -r . ${BANDIT_CONFIG:+-c $BANDIT_CONFIG} -f json -o bandit-report.json
          jq . bandit-report.json
        continue-on-error: true
        env:
          BANDIT_CONFIG: ${{ github.workspace }}/bandit.yaml

      - name: Analyse Safety
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --full-report --output json > safety-report.json
            jq . safety-report.json
          fi
        continue-on-error: true

      - name: Analyse pip-audit
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json 2>/dev/null || true
          [ -f pip-audit-report.json ] && jq . pip-audit-report.json || echo "pip-audit non exécuté"

      - name: Téléverser les rapports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            *-report.json
            requirements.txt

      - name: Vérifier les dépendances obsolètes
        run: pip list --outdated